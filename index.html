  <head>

    <title>Nike Website</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <div>
      <img id="logo" src="./images/nike-logo.png" alt="">

      <h2 id="color">COLOR</h2>
      <img id="img" src="./images/color.png" alt="">
